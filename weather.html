<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barometer — Weather</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0B1826;
      --cream: #F5F0E6;
      --amber: #E8A33D;
      --slate: #4A6FA5;
      --rust: #C1502E;
      --line: rgba(245, 240, 230, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--ink);
    }

    .font-display {
      font-family: 'Fraunces', serif;
    }

    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    .sky-transition {
      transition: background 1.4s ease;
    }

    .ticker {
      animation: scroll-x 40s linear infinite;
    }

    @keyframes scroll-x {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .needle {
      transform-origin: 50% 90%;
      transition: transform 1s cubic-bezier(.4, 1.4, .6, 1);
    }

    ::-webkit-scrollbar {
      height: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker {
        animation: none;
      }

      .needle {
        transition: none;
      }
    }
  </style>
</head>

<body class="min-h-screen text-[var(--cream)]">

  <div id="sky" class="sky-transition min-h-screen"
    style="background: radial-gradient(120% 100% at 50% -10%, #1B3A5C 0%, #0B1826 55%, #060D15 100%);">

    <div class="max-w-3xl mx-auto px-6 py-10 md:py-14">

      <!-- Header / instrument label -->
      <div class="flex items-baseline justify-between border-b border-[var(--line)] pb-4 mb-8">
        <div>
          <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-[var(--amber)] mb-1">No. 04 — Field
            Instrument</p>
          <h1 class="font-display text-3xl md:text-4xl font-medium">Barometer</h1>
        </div>
        <p class="font-mono text-xs text-[var(--cream)]/50 hidden sm:block" id="clock">—</p>
      </div>
      <!-- Search -->
      <form id="searchForm" class="relative mb-10">
        <label class="font-mono text-[11px] tracking-[0.2em] uppercase text-[var(--cream)]/50 block mb-2">Locate a
          station</label>
        <div class="flex gap-2">
          <input id="cityInput" type="text" placeholder="City, country…"
            class="flex-1 bg-transparent border border-[var(--line)] focus:border-[var(--amber)] outline-none rounded-none px-4 py-3 font-display text-lg placeholder:text-[var(--cream)]/30 transition-colors" />
          <button type="submit"
            class="px-5 border border-[var(--amber)] text-[var(--amber)] font-mono text-xs uppercase tracking-[0.15em] hover:bg-[var(--amber)] hover:text-[var(--ink)] transition-colors">
            Read
          </button>
          <button type="button" id="geoBtn" title="Use my location"
            class="px-4 border border-[var(--line)] text-[var(--cream)]/70 hover:border-[var(--cream)]/50 transition-colors font-mono text-xs">
            ⦿
          </button>
        </div>
        <div id="suggestions"
          class="absolute z-10 left-0 right-0 mt-1 bg-[var(--ink)] border border-[var(--line)] hidden"></div>
      </form>

      <!-- Loading / error -->
      <div id="status" class="font-mono text-sm text-[var(--cream)]/50 mb-6 hidden"></div>

      <!-- Main readout -->
      <div id="readout" class="hidden">

        <div class="grid md:grid-cols-[1.3fr_1fr] gap-10 items-start mb-12">
          <!-- Temp dial -->
          <div>
            <p class="font-mono text-[11px] tracking-[0.25em] uppercase text-[var(--amber)] mb-2" id="placeName">—</p>
            <div class="flex items-start gap-4">
              <span class="font-display text-[7rem] md:text-[8.5rem] leading-none font-light" id="tempMain">—</span>
              <span class="font-display text-3xl mt-4 text-[var(--cream)]/60">°C</span>
            </div>
            <p class="font-mono text-sm text-[var(--cream)]/60 mt-1" id="condition">—</p>
            <p class="font-mono text-xs text-[var(--cream)]/40 mt-3" id="feelsLike">—</p>
          </div>
          <!-- Icon + gauges -->
          <div class="border border-[var(--line)] p-6 flex flex-col items-center">
            <div id="iconWrap" class="w-28 h-28 mb-4"></div>
            <div class="grid grid-cols-2 gap-4 w-full font-mono text-xs text-center">
              <div class="border-t border-[var(--line)] pt-2">
                <p class="text-[var(--cream)]/40 uppercase tracking-wider mb-1">Wind</p>
                <p class="text-[var(--cream)] text-sm" id="wind">—</p>
              </div>
              <div class="border-t border-[var(--line)] pt-2">
                <p class="text-[var(--cream)]/40 uppercase tracking-wider mb-1">Humidity</p>
                <p class="text-[var(--cream)] text-sm" id="humidity">—</p>
              </div>
            </div>
          </div>
        </div>
        <!-- Hourly ticker -->
        <div class="mb-12">
          <p
            class="font-mono text-[11px] tracking-[0.25em] uppercase text-[var(--cream)]/50 mb-3 border-b border-[var(--line)] pb-2">
            Next 24 hours</p>
          <div class="overflow-x-auto">
            <div id="hourly" class="flex gap-6 pb-2 min-w-max"></div>
          </div>
        </div>
        <!-- 7-day -->
        <div>
          <p
            class="font-mono text-[11px] tracking-[0.25em] uppercase text-[var(--cream)]/50 mb-3 border-b border-[var(--line)] pb-2">
            Seven-day outlook</p>
          <div id="daily" class="divide-y divide-[var(--line)]"></div>
        </div>

      </div>

      <!-- Empty state -->
      <div id="empty" class="border border-dashed border-[var(--line)] py-16 text-center">
        <p class="font-display text-xl text-[var(--cream)]/60 mb-2">No station selected</p>
        <p class="font-mono text-xs text-[var(--cream)]/40">Search a city above, or use your current location.</p>
      </div>
