<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barometer — Weather</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0B1826;
      --cream: #F5F0E6;
      --amber: #E8A33D;
      --slate: #4A6FA5;
      --rust: #C1502E;
      --line: rgba(245, 240, 230, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--ink);
    }

    .font-display {
      font-family: 'Fraunces', serif;
    }

    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    .sky-transition {
      transition: background 1.4s ease;
    }

    .ticker {
      animation: scroll-x 40s linear infinite;
    }

    @keyframes scroll-x {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .needle {
      transform-origin: 50% 90%;
      transition: transform 1s cubic-bezier(.4, 1.4, .6, 1);
    }

    ::-webkit-scrollbar {
      height: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker {
        animation: none;
      }

      .needle {
        transition: none;
      }
    }
  </style>
